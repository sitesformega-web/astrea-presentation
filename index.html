<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ASTREA™ — Nuevas maneras de mostrarte, nuevas maneras de vender."
    >

    <title>ASTREA™</title>

    <!-- Quicksand -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- Global presentation system -->

    <link
        rel="stylesheet"
        href="./css/global.css"
    >


    <!-- Slide modules -->

    <link
        rel="stylesheet"
        href="./css/slides/slide-01.css"
    >

    <link
        rel="stylesheet"
        href="./css/slides/slide-02.css"
    >

    <link
        rel="stylesheet"
        href="./css/slides/slide-03.css"
    >

</head>


<body>

    <!-- =====================================================
         PRESENTATION STAGE
    ====================================================== -->

    <main
        class="presentation"
        aria-label="Presentación ASTREA"
    >


        <!-- =================================================
             SLIDE 01 — HERO
        ================================================== -->

        <section
            id="slide-01"
            class="slide slide--01 is-active"
            data-slide="1"
            aria-labelledby="slide-01-title"
        >

            <div
                class="slide-01__background"
                aria-hidden="true"
            ></div>


            <div
                class="slide-01__overlay"
                aria-hidden="true"
            ></div>


            <div
                class="slide-01__graphic slide-graphic slide-graphic--from-right"
                style="--graphic-delay: 100ms"
                aria-hidden="true"
            >
                <img
                    src="./assets/images/slide-01-element.png"
                    alt=""
                >
            </div>


            <div class="slide-01__primary">

                <img
                    class="slide-01__logo reveal"
                    style="--reveal-delay: 120ms"
                    src="./assets/images/ASTREA LOGO.png"
                    alt="ASTREA"
                >


                <h1
                    id="slide-01-title"
                    class="slide-01__claim reveal"
                    style="--reveal-delay: 240ms"
                >
                    Tu comercio,<br>
                    más simple.
                </h1>

            </div>


            <p
                class="slide-01__statement reveal"
                style="--reveal-delay: 380ms"
            >
                Plataforma de ventas<br>

                <strong>
                    ligera, modular y<br>
                    adaptable.
                </strong>
            </p>

        </section>


        <!-- =================================================
             SLIDE 02
        ================================================== -->

        <section
            id="slide-02"
            class="slide slide--02"
            data-slide="2"
            aria-labelledby="slide-02-title"
            aria-hidden="true"
        >

            <div
                class="slide-02__graphic slide-graphic slide-graphic--from-right"
                style="--graphic-delay: 80ms"
                aria-hidden="true"
            >
                <img
                    src="./assets/images/slide-02-element.png"
                    alt=""
                >
            </div>


            <div class="slide-02__content">

                <h2
                    id="slide-02-title"
                    class="presentation-title reveal"
                    style="--reveal-delay: 100ms"
                >
                    Ordenar, mostrar<br>
                    y vender.
                </h2>


                <p
                    class="presentation-paragraph reveal"
                    style="--reveal-delay: 220ms"
                >
                    Una estructura
                    <strong>práctica y sencilla</strong>
                    para la organización de tu negocio.
                </p>


                <div
                    class="reveal"
                    style="--reveal-delay: 340ms"
                >
                    <a
                        class="presentation-button"
                        href="#"
                    >
                        CONECTA NEGOCIO
                    </a>
                </div>

            </div>


            <div
                class="slide-02__media reveal reveal--media"
                style="--reveal-delay: 460ms"
            >
                <img
                    src="./assets/images/slide-02-main.png"
                    alt=""
                >
            </div>

        </section>


        <!-- =================================================
             SLIDE 03
        ================================================== -->

        <section
            id="slide-03"
            class="slide slide--03"
            data-slide="3"
            aria-label="Plataforma de ventas adaptable"
            aria-hidden="true"
        >

            <div
                class="slide-03__graphic slide-graphic slide-graphic--from-left"
                style="--graphic-delay: 60ms"
                aria-hidden="true"
            >
                <img
                    src="./assets/images/slide-03-element.png"
                    alt=""
                >
            </div>


            <p
                class="slide-03__statement reveal"
                style="--reveal-delay: 100ms"
            >
                Plataforma de ventas<br>

                <strong>
                    ligera, modular y<br>
                    adaptable.
                </strong>
            </p>


            <div class="slide-03__gallery">

                <div
                    class="slide-03__image slide-03__image--low reveal reveal--media"
                    style="--reveal-delay: 200ms"
                >
                    <img
                        src="./assets/images/slide-02-main.png"
                        alt=""
                    >
                </div>


                <div
                    class="slide-03__image slide-03__image--high reveal reveal--media"
                    style="--reveal-delay: 320ms"
                >
                    <img
                        src="./assets/images/slide-02-main.png"
                        alt=""
                    >
                </div>


                <div
                    class="slide-03__image slide-03__image--low reveal reveal--media"
                    style="--reveal-delay: 440ms"
                >
                    <img
                        src="./assets/images/slide-02-main.png"
                        alt=""
                    >
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         GLOBAL NAVIGATOR
    ====================================================== -->

    <button
        class="presentation-navigator"
        type="button"
        aria-label="Volver al inicio"
        hidden
    >
        <img
            src="./assets/images/navigator.png"
            alt=""
        >
    </button>


    <!-- Scripts -->

    <script src="./js/animations.js"></script>
    <script src="./js/parallax.js"></script>
    <script src="./js/presentation.js"></script>

</body>

</html>
