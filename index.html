<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="ASTREA™ — Nuevas maneras de mostrarte, nuevas maneras de vender."
    >

    <title>ASTREA™</title>

    <!-- Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <main class="presentation">

        <!-- ========================================
             SLIDE 01 — HERO
        ========================================= -->

        <section
            id="home"
            class="slide slide--hero"
            aria-label="ASTREA"
        >

            <div class="hero">
                <h1 class="hero__title">
                    ASTREA™
                </h1>

                <p class="hero__claim">
                    Nuevas maneras de mostrarte,<br>
                    nuevas maneras de vender.
                </p>
            </div>

        </section>


        <!-- ========================================
             SLIDE 02
        ========================================= -->

        <section
            id="slide-02"
            class="slide slide--02"
            aria-labelledby="slide-02-title"
        >

            <!-- Decorative layer -->

            <div
                class="slide-02__graphic"
                aria-hidden="true"
            >
                <img
                    src="./assets/images/slide-02-element.png"
                    alt=""
                >
            </div>


            <!-- Content layer -->

            <div class="slide-02__content">

                <h2
                    id="slide-02-title"
                    class="presentation-title reveal reveal--01"
                >
                    Ordenar, mostrar<br>
                    y vender.
                </h2>

                <p
                    class="presentation-paragraph reveal reveal--02"
                >
                    Una estructura
                    <strong>práctica y sencilla</strong>
                    para la organización de tu negocio.
                </p>

                <div class="reveal reveal--03">

                    <a
                        class="presentation-button"
                        href="#"
                    >
                        CONOCÉ MÁS
                    </a>

                </div>

            </div>


            <!-- Media layer -->

            <div class="slide-02__media reveal reveal--media">

                <img
                    src="./assets/images/slide-02-main.png"
                    alt="Presentación de ASTREA"
                >

            </div>


            <!-- Navigation layer -->

            <a
                class="slide-navigator"
                href="#home"
                aria-label="Volver al inicio"
            >
                <img
                    src="./assets/images/navigator.png"
                    alt=""
                >
            </a>

        </section>

    </main>

    <script src="./js/main.js"></script>

</body>

</html>
